plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.onda'
version = '0.1.0'

android {
  namespace 'com.onda.playback'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Media3 e' sotto Apache 2.0. Una versione nuova va provata su device:
  // coda, notifica, Android Auto e ripresa dopo un errore di rete.
  def media3 = '1.11.1'
  implementation "androidx.media3:media3-exoplayer:$media3"
  implementation "androidx.media3:media3-session:$media3"

  testImplementation 'junit:junit:4.13.2'
  // Il vero org.json al posto dello stub di android.jar, per l'albero di Auto.
  testImplementation 'org.json:json:20240303'
}
