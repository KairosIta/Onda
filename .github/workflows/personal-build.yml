name: Verify personal build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build:personal
      # L'APK resta nel runner e non viene caricato da nessuna parte: qui
      # si verifica soltanto che la build lo abbia davvero prodotto.
      - name: Assert that the personal APK was produced
        run: node -e "if (!require('node:fs').statSync('dist/personal/Onda-personal.apk').isFile()) process.exit(1)"
