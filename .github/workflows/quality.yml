name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Le azioni sono fissate allo SHA del commit, con la versione accanto: un tag
# si puo' spostare, uno SHA no. Dependabot aggiorna SHA e commento insieme.
jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # expo-doctor e' nelle devDependencies: npx usa la copia del lockfile,
      # non l'ultima versione pubblicata.
      - run: npx expo-doctor
      - run: npx expo prebuild --platform android --clean --no-install

  native-player:
    name: Media3 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      ONDA_FORCE_DEBUG_RELEASE: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Il pacchetto `tools`, predefinito nella v3, non e' piu' servito da Google:
      # qui si chiede all'azione soltanto cio' che serve alla build.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      # Le dipendenze Gradle (AGP, Kotlin, Media3, gli artefatti React) pesano
      # piu' di un gigabyte: dalla cache del repository arrivano in secondi,
      # senza i download che il 28 ottobre 2026 hanno bloccato quattro job
      # per mezz'ora. La chiave segue il lockfile e i file Gradle del progetto.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'modules/onda-player/android/build.gradle', 'plugins/with-release-signing.js') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - run: npm run prebuild -- --no-install
      # Gli avvisi committati devono corrispondere alle dipendenze: il
      # controllo esporta il bundle e interroga Gradle, che qui ha JDK e SDK.
      - run: npm run notices:check
      - run: npm run android:test:player

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      # Come `npm audit --audit-level=high`, ma con le eccezioni dichiarate
      # in scripts/audit-policy.ts per gli avvisi che non hanno ancora una
      # versione corretta.
      - run: npm run check:audit
