name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx expo-doctor
      - run: npx expo prebuild --platform android --clean --no-install

  native-player:
    name: Media3 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      ONDA_FORCE_DEBUG_RELEASE: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Il pacchetto `tools`, predefinito nella v3, non e' piu' servito da Google:
      # qui si chiede all'azione soltanto cio' che serve alla build.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run prebuild -- --no-install
      # Gli avvisi committati devono corrispondere alle dipendenze: il
      # controllo esporta il bundle e interroga Gradle, che qui ha JDK e SDK.
      - run: npm run notices:check
      - run: npm run android:test:player

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci
      # Come `npm audit --audit-level=high`, ma con le eccezioni dichiarate
      # in scripts/audit-policy.ts per gli avvisi che non hanno ancora una
      # versione corretta.
      - run: npm run check:audit
